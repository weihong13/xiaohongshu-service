spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/xiaohongshu?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1 FROM DUAL
      connectionProperties: config.decrypt=true;config.decrypt.key=MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAKPXBuJUENH4CgSdoTnxMYIWrC5DZft4zPdUQH+IEWSql1jbfGZkY0O53YMMSkVbXlOSXxuXlOo9btnE5q58ykkCAwEAAQ==
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: false
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME}
        login-password: ${DRUID_PASSWORD}
      filter:
        config:
          enabled: true
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    data:
      redis:
        database: 0 # Redis 数据库索引（默认为 0）
        host: 127.0.0.1 # Redis 服务器地址
        port: 6380 # Redis 服务器连接端口
        password: ${REDIS_PASSWORD} # Redis 服务器连接密码（默认为空）
        timeout: 5s # 读超时时间
        connect-timeout: 5s # 链接超时时间
        lettuce:
          pool:
            max-active: 200 # 连接池最大连接数
            max-wait: -1ms # 连接池最大阻塞等待时间（使用负值表示没有限制）
            min-idle: 0 # 连接池中的最小空闲连接
            max-idle: 10 # 连接池中的最大空闲连接

logging:
  level:
    com.guoshisan.xiaohongshu.user.biz.domain.mapper: debug